<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Site</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="home" id="homeScreen">

    <div class="logo">🎮</div>

    <h1>PLAY TOGETHER</h1>

    <p class="subtitle">
      العب مع صحابك مباشرة أونلاين
    </p>

    <div class="menu">

      <button class="primary-btn" id="createGame">
        إنشاء لعبة
      </button>

      <button class="secondary-btn" id="joinGame">
        دخول بكود
      </button>

    </div>

    <p class="status" id="status">
      جاهز للعب
    </p>

  </main>


  <!-- JOIN ROOM MODAL -->

  <div class="game-modal hidden" id="joinModal">

    <div class="modal-card">

      <button class="modal-close" id="closeJoinModal">
        ×
      </button>

      <div class="modal-icon">
        🔗
      </div>

      <h2>دخول للغرفة</h2>

      <p>
        دخل الكود اللي عطاك صاحبك
      </p>

      <input
        id="roomCodeInput"
        class="room-input"
        type="text"
        maxlength="6"
        autocomplete="off"
        placeholder="ABC123"
      >

      <div class="modal-error" id="joinError"></div>

      <button class="primary-btn modal-action" id="confirmJoin">
        دخول
      </button>

    </div>

  </div>


  <!-- ROOM WAITING SCREEN -->

  <section class="waiting-screen hidden" id="waitingScreen">

    <div class="waiting-content">

      <div class="waiting-icon">
        🎮
      </div>

      <div class="waiting-label">
        ROOM CODE
      </div>

      <div class="room-code-big" id="waitingRoomCode">
        ------
      </div>

      <div class="copy-hint">
        شارك هاد الكود مع صاحبك
      </div>

      <div class="waiting-animation">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <h2 id="waitingTitle">
        كنستناو اللاعب الثاني...
      </h2>

      <p id="waitingText">
        خلي هاد الصفحة محلولة
      </p>

      <button class="cancel-btn" id="cancelRoom">
        إلغاء الغرفة
      </button>

    </div>

  </section>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script src="firebase.js"></script>
<script src="core.js?v=130"></script>

</body>
</html>
